# STE instruction hooks (docs\formats\RECOMP_HOOKS.md). Hook functions live in candidate<N>\src\recomp_manual.c.
# STEM gameplay toggles (goal 3c); STEM/NastySoft pnach is only the specification, see docs\community\STEM_TOGGLES.md.

# stem_no_knockback_scaling: sub_0010D2E0 knockback class, esi-- / esi++ (PS2 0x003C2260 / 0x003C2278)
[[hook]]
addr = 0x0010D36A
fn   = "ste_hook_knock_dec"
mode = "replace"
[[hook]]
addr = 0x0010D380
fn   = "ste_hook_knock_inc"
mode = "replace"

# stem_no_juggle_limit: sub_0011E490 juggle counter inc [monster+0x938] (PS2 0x003ABA5C)
[[hook]]
addr = 0x0011ED54
fn   = "ste_hook_juggle"
mode = "replace"
[[hook]]
addr = 0x0011ED54
fn   = "ste_hook_juggle_after"
mode = "after"

# logging probes (STE_STEM_LOG=1) in the health-floor function sub_00112AC0 (stem_no_min_health patches its 0.025f constant instead)
[[hook]]
